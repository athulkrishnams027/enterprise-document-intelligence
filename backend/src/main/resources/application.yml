server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: /

spring:
  application:
    name: document-intelligence
  config:
    import: classpath:ai-provider-routing.properties
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5433}/${POSTGRES_DB:document_intelligence}
    username: ${POSTGRES_USER:docintel}
    password: ${POSTGRES_PASSWORD:change_me_strong_db_password}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  servlet:
    multipart:
      enabled: true
      max-file-size: ${APP_MAX_UPLOAD_SIZE:50MB}
      max-request-size: ${APP_MAX_UPLOAD_SIZE:50MB}

  ai:
    model:
      chat: ${AI_CHAT_PROVIDER:ollama}
    ollama:
      base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
      init:
        pull-model-strategy: never
      chat:
        options:
          model: ${OLLAMA_CHAT_MODEL:qwen2.5:7b}
          temperature: ${RAG_TEMPERATURE:0.2}
      embedding:
        options:
          model: ${OLLAMA_EMBEDDING_MODEL:nomic-embed-text}
    openai:
      api-key: ${OPENAI_API_KEY:}
      chat:
        options:
          model: ${OPENAI_CHAT_MODEL:gpt-4o-mini}
          temperature: ${RAG_TEMPERATURE:0.2}
      embedding:
        options:
          model: ${OPENAI_EMBEDDING_MODEL:text-embedding-3-small}
    google:
      genai:
        api-key: ${GOOGLE_GENAI_API_KEY:}
        chat:
          options:
            model: ${GEMINI_CHAT_MODEL:gemini-2.5-flash}
            temperature: ${RAG_TEMPERATURE:0.2}
        embedding:
          api-key: ${GOOGLE_GENAI_API_KEY:}
          text:
            options:
              model: ${GEMINI_EMBEDDING_MODEL:text-embedding-004}
    vectorstore:
      pgvector:
        initialize-schema: true
        schema-name: public
        table-name: vector_store
        id-type: UUID
        dimensions: ${VECTOR_DIMENSIONS:768}
        index-type: HNSW
        distance-type: COSINE_DISTANCE
        max-document-batch-size: 500

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when_authorized

app:
  security:
    jwt:
      secret: ${JWT_SECRET:ZGV2LW9ubHktY2hhbmdlLW1lLWluLXByb2R1Y3Rpb24tNjQtYnl0ZS1zZWNyZXQta2V5LTIwMjY=}
      expiration-ms: ${JWT_EXPIRATION_MS:86400000}
    cors:
      allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}
    rate-limit:
      enabled: ${RATE_LIMIT_ENABLED:true}
      requests-per-minute: ${RATE_LIMIT_RPM:60}
  storage:
    root-path: ${APP_STORAGE_ROOT:../storage}
    max-file-size-bytes: 52428800
  ai:
    chat-provider: ${AI_CHAT_PROVIDER:ollama}
    embedding-provider: ${AI_EMBEDDING_PROVIDER:ollama}
    expected-embedding-dimensions: ${VECTOR_DIMENSIONS:768}
    chunking:
      target-tokens: ${CHUNK_TARGET_TOKENS:800}
      overlap-tokens: ${CHUNK_OVERLAP_TOKENS:150}
    rag:
      top-k: ${RAG_TOP_K:6}
      similarity-threshold: ${RAG_SIMILARITY_THRESHOLD:0.55}
      max-context-chars: ${RAG_MAX_CONTEXT_CHARS:12000}
      temperature: ${RAG_TEMPERATURE:0.2}
      max-history-turns: 6

logging:
  level:
    com.athul.documentintelligence: INFO
    org.springframework.ai: INFO
